# Store configuration: which Apify actor scrapes each store, how to read its
# output, and each store's fulfillment fees.
#
# IMPORTANT - read this before trusting the numbers below:
#   `verified: false` on a fulfillment option means the fee is a placeholder,
#   not a confirmed current figure. Confirmed as of Aug 2026 research: Tesco,
#   Asda, Sainsbury's delivery/click&collect thresholds. Everything else
#   (Morrisons, Waitrose, Ocado, Aldi, Iceland) is an estimate - check the
#   store's own delivery pricing page and correct it before trusting the
#   recommendation for real money. Fees change often and vary by postcode.
#
#   `apify_actor_id: null` means no reliable scraper actor was found for that
#   store - it's excluded from automated price fetching (see notes).
#
#   `fields:` maps this specific actor's output JSON keys to name/price/
#   unit_price/in_stock. These are best guesses from the actor's public
#   description, not a verified schema - after your first real (non-demo) run,
#   check output/*.raw.json and fix the field names if quotes come back empty.

stores:
  - name: Tesco
    enabled: false
    # Attempt 1, jupri/tesco-grocery: legacy "rental" Actor, $30/month - rejected.
    # Attempt 2, illehius/tesco-scraper: ran but returned 0 products for every
    # search term then failed - looked like Tesco blocking/breaking this actor.
    # Attempt 3, radeance/tesco-scraper: ignored our searchTerms input
    # entirely (log showed "Keyword: None") and just crawled 27 random
    # products from a general category page - not real search results.
    # Attempt 4, ecomscrape/tesco-product-search-scraper (real run 9 Aug
    # 2026): another rental trap - "You must rent a paid Actor..." after its
    # free trial. Two rental actors out of four attempts - Tesco seems
    # unusually rental-heavy on Apify. Disabled; worth trying the
    # Trolley.co.uk aggregator actor instead of hunting for another
    # single-store Tesco actor (see trolley_aggregator block at the bottom
    # of this file).
    apify_actor_id: ecomscrape/tesco-product-search-scraper
    apify_search_field: searchTerms
    # Guessing `name` rather than `title` - every actor confirmed so far
    # (Asda, and the previous Morrisons actor's own logs) used `name`.
    fields:
      name: name
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: true
        fee: 4.5
        verified: false
        notes: "Delivery £3-£7 depending on slot/location (Which?, Aug 2026). Using midpoint - check your slot."
      - kind: click_collect
        available: true
        fee: 1.0
        surcharge_under: 25
        surcharge_amount: 5.0
        verified: true
        notes: "£0-£2 depending on location; £25 minimum basket, £5 surcharge if under."
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Asda
    # Temporarily disabled - already confirmed working against the real
    # shopping list (9 Aug 2026), cached at output/raw/Asda.raw.json. Saving
    # credit while the other stores get sorted out; will re-combine everyone
    # via --from-raw once they're all confirmed.
    enabled: false
    apify_actor_id: illehius/asda-scraper
    # Same publisher as illehius/tesco-scraper, which confirmed `queries` is the
    # required field - confirmed independently for this actor too (real run,
    # 9 Aug 2026): it also uses `queries`.
    apify_search_field: queries
    # Confirmed via output/raw/Asda.raw.json (9 Aug 2026): product name field
    # is `name`, not `title`. price/unitPrice were already correct. No
    # inStock field exists in this actor's output at all - matcher.py
    # defaults to "in stock" when the key is missing, so that's fine as-is.
    fields:
      name: name
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: true
        fee: 3.0
        free_over: 40
        verified: true
        notes: "£3 under £40 basket, free at/over £40. Delivery Pass subscription not modelled."
      - kind: click_collect
        available: true
        fee: 3.0
        free_over: 25
        verified: true
        notes: "£3 under £25 basket, free at/over £25."
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Sainsburys
    enabled: false
    # Attempt 1, illehius/sainsburys-scraper: every request failed with
    # "Proxy rejected the CONNECT tunnel with status code 403", even after
    # retrying with an explicit proxyConfiguration input - actor looks broken
    # regardless of our input.
    # Attempt 2, dromb/sainsburys-uk-grocery-price-availability: ran (data
    # extraction now correctly fixed with apify_data_root + dotted field
    # paths, confirmed via output/raw/Sainsburys.raw.json), but real-world
    # match quality was terrible - "bread" matched "grapes", "baked beans"
    # matched "apples" (real run 9 Aug 2026). The run also finished in ~4.5s,
    # far too fast for 27 genuine per-term searches (Asda/Morrisons took
    # 20-30s+ for the same 27 terms). Looks like this actor ignores
    # searchTerms too and just returns a small generic sample. Disabled -
    # needs a third Sainsbury's actor, not another field-mapping tweak.
    apify_actor_id: dromb/sainsburys-uk-grocery-price-availability
    apify_search_field: searchTerms
    apify_data_root: data
    fields:
      name: name
      price: currentPrice.value
      unit_price: unitPrice.value
      in_stock: availability
    fulfillment:
      - kind: delivery
        available: true
        fee: 4.5
        free_over: 40
        verified: false
        notes: "Delivery fee not confirmed in research - placeholder, check sainsburys.co.uk."
      - kind: click_collect
        available: true
        fee: 4.0
        free_over: 40
        verified: true
        notes: "£4 under £40 basket, free at/over £40. Same-day collect adds £2 under £25 - not modelled."
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Morrisons
    # Temporarily disabled - already confirmed working against the real
    # shopping list (9 Aug 2026), cached at output/raw/Morrisons.raw.json.
    # Saving credit; will re-combine via --from-raw once everyone's sorted.
    enabled: false
    # Attempt 1, studio-amba/morrisons-scraper: ignored our search terms
    # entirely and just crawled the first 100 products of its "full catalog"
    # mode - not usable for targeted list lookups.
    # Attempt 2 (this one): bobcodgodkid.1/morrisons-grocery-scraper, which
    # claims explicit search-term support. Field name/mapping unconfirmed -
    # check output/raw/Morrisons.raw.json after this run.
    apify_actor_id: bobcodgodkid.1/morrisons-grocery-scraper
    apify_search_field: searchTerms
    # Confirmed via output/raw/Morrisons.raw.json (9 Aug 2026): real run,
    # genuinely honoured our search terms (46 products across 27 queries,
    # cost $0.15). `name` and `price` were right. `unitPrice` was wrong AND
    # the real data (`unit_price`) is a nested {amount, basis} object our
    # flat field-mapping can't reach - left as-is since unit price isn't
    # shown in the report yet anyway. `in_stock` was wrong - real field is
    # `available` (true/false), fixed below; this actually matters, unlike
    # other stores where the missing key just fell back to "always in
    # stock" harmlessly.
    fields:
      name: name
      price: price
      unit_price: unitPrice
      in_stock: available
    fulfillment:
      - kind: delivery
        available: true
        fee: 5.0
        free_over: 40
        verified: false
        notes: "Morrisons uses Anytime/Midweek delivery passes (£5-£8/mo) rather than a simple per-order fee. Placeholder flat fee - check morrisons.com for your postcode."
      - kind: click_collect
        available: false
        verified: false
        notes: "Limited click&collect availability - confirm for your store before enabling."
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Waitrose
    enabled: false
    # Attempt 1, illehius/waitrose-scraper: crashed twice in a row, both
    # times with total data loss (empty dataset despite partial success in
    # the logs) - looks like this actor only writes output at the very end
    # of a run, so any crash loses everything.
    # Attempt 2, thenetaji/waitrose-scraper (real run 9 Aug 2026): rental
    # trap - "You must rent a paid Actor...". Disabled; worth trying the
    # Trolley.co.uk aggregator instead (see trolley_aggregator block below).
    apify_actor_id: thenetaji/waitrose-scraper
    apify_search_field: searchTerms
    fields:
      name: name
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: true
        fee: 6.0
        free_over: 60
        verified: false
        notes: "Placeholder - not confirmed. Waitrose typically waives fees for myWaitrose members over a spend threshold; check current terms."
      - kind: click_collect
        available: true
        fee: 0.0
        verified: false
        notes: "Placeholder - Waitrose click&collect has historically been free; confirm."
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Ocado
    enabled: true
    apify_actor_id: null
    apify_search_field: searchTerms
    fields:
      name: title
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: true
        fee: 5.5
        free_over: 40
        verified: false
        notes: "Placeholder - Ocado is delivery-only, fee varies by slot and Smart Pass status; confirm."
      - kind: click_collect
        available: false
      - kind: in_store
        available: false
        notes: "Ocado has no physical stores."
    notes: "No dedicated Ocado Apify actor confirmed at time of writing - covered instead via the Trolley.co.uk multi-retailer actor (studio-amba/uk-grocery-price-matrix) if enabled below."

  - name: Aldi
    enabled: false
    # Attempt 1, studio-amba/aldi-scraper: never actually ran - its estimated
    # job cost kept exceeding the remaining free-tier budget (~$3-4), even
    # though we only sent 27 search terms. Likely defaults to a large/full
    # catalog crawl like the first Morrisons actor did.
    # Attempt 2, illehius/aldi-uk-scraper (real run 9 Aug 2026): the `queries`/
    # `name` guess (reused from the working Asda actor) was actually correct -
    # genuinely found 20 products per search term for 11/27 queries - but then
    # crashed (FAILED status) and the dataset came back completely empty, same
    # "only writes output at the end" failure as the old Waitrose actor.
    # Disabled pending a retry or a different actor; the field mapping below
    # is believed correct if/when this gets a clean run.
    apify_actor_id: illehius/aldi-uk-scraper
    apify_search_field: queries
    fields:
      name: name
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: false
        notes: "Aldi UK does not offer its own grocery delivery/click&collect."
      - kind: click_collect
        available: false
      - kind: in_store
        available: true
        fee: 0.0
        verified: true

  - name: Iceland
    enabled: true
    apify_actor_id: null
    apify_search_field: searchTerms
    fields:
      name: title
      price: price
      unit_price: unitPrice
      in_stock: inStock
    fulfillment:
      - kind: delivery
        available: true
        fee: 3.0
        free_over: 40
        verified: false
        notes: "Placeholder - confirm at iceland.co.uk, fee is usually small and often free over a basket threshold."
      - kind: click_collect
        available: false
      - kind: in_store
        available: true
        fee: 0.0
        verified: true
    notes: "No confirmed dedicated Iceland Apify actor at time of writing - search the Apify Store before enabling; left as apify_actor_id: null so it's skipped until you wire one up."

  - name: Poundland
    enabled: false
    apify_actor_id: null
    fulfillment:
      - kind: delivery
        available: false
      - kind: click_collect
        available: false
      - kind: in_store
        available: true
        fee: 0.0
        verified: true
    notes: "No online grocery ordering or price-scraping actor found - Poundland is in-store only and not price-tagged per item online. Disabled by default; check prices manually if it matters for your list."

# Optional: a single actor that scrapes Trolley.co.uk itself and already
# aggregates Tesco/Asda/Sainsbury's/Morrisons/Waitrose/Ocado/Aldi price
# comparisons. Worth trying as an alternative to running 6+ separate actors -
# see README for the tradeoff.
trolley_aggregator:
  enabled: false
  apify_actor_id: studio-amba/uk-grocery-price-matrix
